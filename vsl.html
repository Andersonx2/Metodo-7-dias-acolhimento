<html lang="pt-BR">
<head>

<title>Método 7 Dias de Acolhimento — apresentação</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --deep:#0B5345;
  --ink:#FFFDF8;
  --soft:rgba(255,253,248,.80);
  --gold:#E8D4A4;
  --gold-forte:#D6B776;
  --linha:rgba(232,212,164,.30);
  --display:"Lora","Iowan Old Style",Georgia,serif;
  --body:"Inter","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:#07110F;color:var(--ink);font-family:var(--body);
  display:grid;place-items:center;
  padding:max(12px,env(safe-area-inset-top,0)) max(12px,env(safe-area-inset-right,0))
          max(12px,env(safe-area-inset-bottom,0)) max(12px,env(safe-area-inset-left,0));
  -webkit-font-smoothing:antialiased;
}

.player{
  position:relative;width:min(1100px,100%);aspect-ratio:16/9;
  border-radius:14px;overflow:hidden;background:var(--deep);
  box-shadow:0 30px 80px rgba(0,0,0,.55);
  container-type:inline-size;user-select:none;cursor:pointer;
}
.player.cheio{border-radius:0;width:100%;height:100%;aspect-ratio:auto}
@media (max-width:760px){
  body{padding:0;align-items:stretch}
  .player{border-radius:0;width:100%;height:100%;aspect-ratio:auto}
}

.fundo{position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(60cqw 70cqw at 78% 14%, rgba(214,183,118,.22), transparent 62%),
    radial-gradient(55cqw 60cqw at 4% 94%, rgba(255,255,255,.08), transparent 66%),
    linear-gradient(122deg,#0A4C3F 0%,#0E6B57 54%,#0B5245 100%);
  animation:deriva 22s ease-in-out infinite alternate;
}
@keyframes deriva{
  from{transform:scale(1.06) translate3d(-1.3%,-0.9%,0)}
  to{transform:scale(1.15) translate3d(1.5%,1.2%,0)}
}
.player.pausado .fundo{animation-play-state:paused}
.grao{position:absolute;inset:0;z-index:1;opacity:.055;pointer-events:none;
  background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}
.vinheta{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(130% 110% at 50% 45%,transparent 48%,rgba(0,0,0,.40) 100%)}

.palco{position:absolute;inset:0;z-index:3;display:grid;place-items:center;padding:6cqw 7cqw 10cqw}
.slide{display:none;width:100%;max-width:74cqw;text-align:center}
.slide.ativo{display:block}
.ator{opacity:0;will-change:opacity,transform}

.eyebrow{
  font-size:1.35cqw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;
  color:var(--gold);margin:0 0 2.2cqw;display:inline-flex;align-items:center;gap:.9cqw;
}
.eyebrow::before{content:"";width:.55cqw;height:.55cqw;border-radius:50%;background:var(--gold-forte)}
.grande{
  font-family:var(--display);font-weight:700;font-size:4.2cqw;line-height:1.14;
  letter-spacing:-.018em;margin:0;text-wrap:balance;position:relative;
}
.grande em{font-style:italic;color:var(--gold)}
.nota{font-size:1.75cqw;line-height:1.5;color:var(--soft);margin:2.1cqw auto 0;max-width:50ch}
.preco{font-family:var(--display);font-weight:700;font-size:11cqw;line-height:1;margin:0;letter-spacing:-.03em}
.preco small{font-size:3cqw;font-weight:600;vertical-align:.9cqw;margin-right:.5cqw;color:var(--gold)}
.apoio{font-size:1.9cqw;color:var(--gold);margin:1.1cqw 0 0;font-weight:500}

.ch{opacity:0}
.pa{opacity:0;display:inline-block}
.cursor{position:absolute;width:.055em;background:var(--gold);border-radius:1px;
  pointer-events:none;animation:pisca .62s steps(1) infinite}
.player.pausado .cursor{animation-play-state:paused}
@keyframes pisca{0%,49%{opacity:1}50%,100%{opacity:0}}

.bolhas{display:flex;flex-direction:column;gap:1.1cqw;max-width:46cqw;margin:0 auto;text-align:left}
.bolha{padding:1.5cqw 1.9cqw;border-radius:1.5cqw;font-size:1.75cqw;line-height:1.45;max-width:88%}
.bolha.dela{background:rgba(255,255,255,.10);border:1px solid var(--linha);border-bottom-left-radius:.4cqw;align-self:flex-start}
.bolha.sua{background:#FFFDF8;color:#14322B;border-bottom-right-radius:.4cqw;align-self:flex-end;font-weight:500}
.digitando{align-self:flex-end;display:flex;gap:.45cqw;padding:1.5cqw 1.9cqw;border-radius:1.5cqw;
  background:#FFFDF8;border-bottom-right-radius:.4cqw}
.digitando i{width:.75cqw;height:.75cqw;border-radius:50%;background:#7C8F88;animation:pula .9s infinite}
.digitando i:nth-child(2){animation-delay:.15s}
.digitando i:nth-child(3){animation-delay:.3s}
@keyframes pula{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-.5cqw);opacity:1}}
.player.pausado .digitando i{animation-play-state:paused}

.lista{list-style:none;margin:0 auto;padding:0;max-width:58cqw;display:grid;gap:.6cqw;text-align:left}
.lista.duas{max-width:68cqw;grid-template-columns:1fr 1fr;column-gap:1.1cqw}
.lista li{
  display:grid;grid-template-columns:9.5cqw 1fr;gap:1.1cqw;align-items:center;
  background:rgba(255,255,255,.075);border:1px solid var(--linha);border-radius:.8cqw;
  padding:.85cqw 1.3cqw;font-size:1.45cqw;
}
.lista .quando{font-size:1.05cqw;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--gold);white-space:nowrap}

.selo{
  display:inline-grid;place-items:center;width:11cqw;height:11cqw;border-radius:50%;
  border:.22cqw dashed var(--gold);color:var(--gold);font-size:1.3cqw;line-height:1.15;margin-bottom:2.2cqw;
}
.selo b{display:block;font-family:var(--display);font-size:3.6cqw;font-weight:700;color:var(--ink)}

.capa{position:absolute;inset:0;z-index:7;display:grid;place-items:center;
  background:rgba(7,27,23,.58);backdrop-filter:blur(2px);text-align:center;padding:6cqw}
.capa.off{display:none}
.capa h1{font-family:var(--display);font-weight:700;font-size:4.6cqw;line-height:1.12;margin:0 0 1.6cqw;letter-spacing:-.02em}
.capa h1 em{font-style:italic;color:var(--gold)}
.capa p{font-size:1.8cqw;color:var(--soft);margin:0 0 3.4cqw}
.play{width:9cqw;height:9cqw;border-radius:50%;border:0;cursor:pointer;background:var(--gold);
  display:grid;place-items:center;margin:0 auto;box-shadow:0 1.4cqw 3cqw rgba(0,0,0,.4);transition:transform .18s ease}
.play:hover{transform:scale(1.07)}
.play svg{width:3.4cqw;height:3.4cqw;margin-left:.6cqw;fill:#0A4C3F}
.capa .dur{font-size:1.4cqw;color:var(--gold);margin-top:2.2cqw;letter-spacing:.06em}

.fim{position:absolute;inset:0;z-index:7;display:none;place-items:center;
  background:rgba(7,27,23,.74);backdrop-filter:blur(3px);text-align:center;padding:6cqw}
.fim.on{display:grid}
.fim h2{font-family:var(--display);font-weight:700;font-size:4cqw;line-height:1.14;margin:0 0 1.4cqw}
.fim h2 em{font-style:italic;color:var(--gold)}
.fim p{font-size:1.8cqw;color:var(--soft);margin:0 0 3cqw}
.btn{display:inline-block;background:var(--gold);color:#0A4C3F;font-weight:700;font-size:2cqw;
  text-decoration:none;padding:1.5cqw 3.4cqw;border-radius:.8cqw;box-shadow:0 1.2cqw 2.6cqw rgba(0,0,0,.35)}
.btn:hover{filter:brightness(1.05)}
.rever{display:block;margin:2.2cqw auto 0;background:none;border:0;color:var(--gold);
  font-family:var(--body);font-size:1.5cqw;cursor:pointer;text-decoration:underline;text-underline-offset:.3cqw}

.chrome{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:5cqw 2.2cqw 1.5cqw;
  background:linear-gradient(transparent,rgba(4,18,15,.82) 55%);
  opacity:0;transition:opacity .25s ease;pointer-events:none}
.player:hover .chrome,.player.pausado .chrome{opacity:1;pointer-events:auto}
.trilho{height:.42cqw;min-height:4px;background:rgba(255,253,248,.22);border-radius:99px;cursor:pointer;position:relative}
.trilho:hover{height:.62cqw}
.preenche{position:absolute;inset:0 auto 0 0;width:0;background:var(--gold);border-radius:99px}
.marcas{position:absolute;inset:0;pointer-events:none}
.marcas i{position:absolute;top:0;bottom:0;width:2px;background:rgba(7,27,23,.55)}
.linha{display:flex;align-items:center;gap:1.6cqw;margin-top:1.1cqw}
.ctrl{background:none;border:0;color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
.ctrl svg{width:2.4cqw;height:2.4cqw;fill:currentColor}
.ctrl.sm svg{width:1.9cqw;height:1.9cqw}
.tempo{font-size:1.35cqw;color:var(--soft);font-variant-numeric:tabular-nums;letter-spacing:.03em}
.espaco{flex:1}
.rotulo{font-size:1.3cqw;color:var(--gold);letter-spacing:.14em;text-transform:uppercase;font-weight:600}

@container (max-width:620px){
  .slide{max-width:88cqw}
  .grande{font-size:7.8cqw}

  .capa p,.fim p{font-size:2.9cqw}
  .capa p{margin-bottom:7cqw}
  .fim h2{font-size:5.6cqw}
  .btn{font-size:3cqw;padding:2.4cqw 5cqw}
  .rever{font-size:2.4cqw}
  .play{width:16cqw;height:16cqw}
  .play svg{width:6cqw;height:6cqw}
  .capa .dur{font-size:2.2cqw}
  .tempo,.rotulo{font-size:2.2cqw}
  .ctrl svg{width:4.4cqw;height:4.4cqw}
  .ctrl.sm svg{width:3.6cqw;height:3.6cqw}
  .selo{width:18cqw;height:18cqw;font-size:2.2cqw}
  .selo b{font-size:6cqw}
}
@media (prefers-reduced-motion:reduce){ .fundo{animation:none} .cursor{display:none} }
</style>

var palco    = document.getElementById("palco");
var player   = document.getElementById("player");
var capa     = document.getElementById("capa");
var fim      = document.getElementById("fim");
var trilho   = document.getElementById("trilho");

var marcas   = document.getElementById("marcas");
var icone    = document.getElementById("icone");
var tAtual   = document.getElementById("tAtual");
var tTotal   = document.getElementById("tTotal");

palco.innerHTML = SLIDES.map(function(s,i){
  return '<section class="slide" data-i="'+i+'">'
       + '<p class="eyebrow ator">'+s.eyebrow+'</p>'
       + s.html
       + '<p class="nota ator">'+s.nota+'</p>'
       + '</section>';
}).join("");
var secoes = Array.prototype.slice.call(palco.querySelectorAll(".slide"));

/* quebra o texto em pedacos mantendo <em> e <br> */
function fatiar(el, unidade){
  var pecas = [];
  (function anda(no){
    Array.prototype.slice.call(no.childNodes).forEach(function(k){
      if(k.nodeType === 3){
        var txt = k.nodeValue;
        if(!txt) return;
        var partes = unidade === "ch" ? txt.split("") : txt.split(/(\s+)/);
        var frag = document.createDocumentFragment();
        partes.forEach(function(t){
          if(t === "") return;
          if(/^\s+$/.test(t)){ frag.appendChild(document.createTextNode(t)); return; }
          var sp = document.createElement("span");
          sp.className = unidade === "ch" ? "ch" : "pa";
          sp.textContent = t;
          frag.appendChild(sp); pecas.push(sp);
        });
        no.replaceChild(frag, k);
      } else if(k.nodeType === 1 && k.tagName !== "BR"){
        anda(k);
      }
    });
  })(el);
  el.__p = pecas; el.__n = 0;
  return pecas.length;
}

function revelar(el, n){
  var p = el.__p, prev = el.__n, i;
  if(n === prev) return;
  if(n > prev){ for(i=prev;i<n && i<p.length;i++) p[i].style.opacity = 1; }
  else { for(i=n;i<prev && i<p.length;i++) p[i].style.opacity = 0; }
  el.__n = n;
}

/* mede os caracteres uma unica vez, para o cursor seguir sem reflow */
function medir(el){
  if(el.__m) return el.__m;
  var m = el.__p.map(function(sp){
    return {x:sp.offsetLeft + sp.offsetWidth, y:sp.offsetTop, h:sp.offsetHeight};
  });
  el.__m = m; return m;
}
function porCursor(a, n){
  if(!a.cursor) return;
  var m = medir(a.el);
  if(!m.length) return;
  var k = Math.min(Math.max(n - 1, 0), m.length - 1);
  var c = m[k];
  a.cursor.style.left = (n === 0 ? Math.max(0, c.x - c.h * 0.35) : c.x) + "px";
  a.cursor.style.top = (c.y + c.h * 0.14) + "px";
  a.cursor.style.height = (c.h * 0.74) + "px";
}

/* roteiro de cada slide */
var planos = secoes.map(function(sec){
  var atores = [], t = 0, palavras = 0;

  var eb = sec.querySelector(".eyebrow");
  atores.push({el:eb, tipo:"fade", ini:0, dur:FADE});
  palavras += eb.textContent.trim().split(/\s+/).length;
  t = 0.20;

  var tit = sec.querySelector(".tipo");
  if(tit){
    tit.classList.add("ator");
    palavras += tit.textContent.trim().split(/\s+/).length;
    var nch = fatiar(tit, "ch");
    var cur = document.createElement("span");
    cur.className = "cursor"; cur.style.opacity = 0;
    tit.appendChild(cur);
    atores.push({el:tit, tipo:"escreve", ini:t, dur:nch/CPS, n:nch, cursor:cur});
    t += nch/CPS + 0.10;
  }

  var itens = Array.prototype.slice.call(sec.querySelectorAll(".lista li"));
  itens.forEach(function(li,k){
    li.classList.add("ator");
    atores.push({el:li, tipo:"fade", ini:t + k*PASSO, dur:FADE});
    palavras += li.textContent.trim().split(/\s+/).length * 0.45;
  });
  if(itens.length) t += (itens.length-1)*PASSO + FADE;

  var bolhas = Array.prototype.slice.call(sec.querySelectorAll(".bolha"));
  bolhas.forEach(function(b,k){
    b.classList.add("ator");
    palavras += b.textContent.trim().split(/\s+/).length * 0.8;
    if(k === 0){
      atores.push({el:b, tipo:"fade", ini:t, dur:FADE});
    } else {
      var dig = document.createElement("div");
      dig.className = "digitando ator";
      dig.innerHTML = "<i></i><i></i><i></i>";
      b.parentNode.insertBefore(dig, b);
      var tDig = t + 0.55, tResp = tDig + 1.05;
      atores.push({el:dig, tipo:"janela", ini:tDig, fimJanela:tResp});
      atores.push({el:b, tipo:"fade", ini:tResp, dur:FADE});
      t = tResp;
    }
  });
  if(bolhas.length) t += FADE;

  var extras = Array.prototype.slice.call(sec.querySelectorAll(".preco,.apoio,.selo"));
  extras.forEach(function(el,k){
    el.classList.add("ator");
    atores.push({el:el, tipo:"fade", ini:t + k*0.14, dur:FADE});
    palavras += el.textContent.trim().split(/\s+/).length;
  });
  if(extras.length) t += (extras.length-1)*0.14 + FADE;

  var nota = sec.querySelector(".nota");
  var npa = fatiar(nota, "pa");
  atores.push({el:nota, tipo:"escreve", ini:t + 0.08, dur:npa/WPS, n:npa});
  palavras += npa;
  t += 0.08 + npa/WPS;

  var piso = palavras/VEL_LEIT + 0.6;
  var dur = Math.max(t + RESPIRO, piso);
  return {atores:atores, dur:Math.min(9, Math.max(2.6, dur))};
});

var inicios = [], acc = 0;
planos.forEach(function(p){ inicios.push(acc); acc += p.dur; });
var TOTAL = acc;

marcas.innerHTML = inicios.slice(1).map(function(x){
  return '<i style="left:'+((x/TOTAL)*100)+'%"></i>';
}).join("");

function mmss(s){
  s = Math.max(0, Math.round(s));
  return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
}
tTotal.textContent = mmss(TOTAL);
document.getElementById("dur").textContent = "apresentação de " + mmss(TOTAL);

var t = 0, rodando = false, ultimo = 0, slideAtual = -1, marcos = {};
function clamp(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }

function aplicar(i, local){
  planos[i].atores.forEach(function(a){
    if(a.tipo === "escreve"){
      var n = Math.round(clamp((local - a.ini)/(a.dur || .001)) * a.n);
      a.el.style.opacity = local >= a.ini ? 1 : 0;
      revelar(a.el, n);
      if(a.cursor){
        var mostra = local >= a.ini && local < a.ini + a.dur + 0.45;
        a.cursor.style.opacity = mostra ? 1 : 0;
        if(mostra) porCursor(a, n);
      }
    } else if(a.tipo === "janela"){
      var dentro = local >= a.ini && local < a.fimJanela;
      a.el.style.opacity = dentro ? 1 : 0;
      a.el.style.display = dentro ? "" : "none";
    } else {
      var p = clamp((local - a.ini)/a.dur);
      a.el.style.opacity = p;
      a.el.style.transform = p < 1 ? "translateY(" + ((1-p)*10).toFixed(1) + "px)" : "none";
    }
  });
}

function pintaSlide(i){
  if(i !== slideAtual){
    slideAtual = i;
    secoes.forEach(function(el,n){ el.classList.toggle("ativo", n === i); });
    rotulo.textContent = (i+1) + " de " + SLIDES.length;
  }
}
function indicePara(x){
  for(var i = inicios.length - 1; i >= 0; i--){ if(x >= inicios[i]) return i; }
  return 0;
}
function pinta(){
  preenche.style.width = Math.min(100,(t/TOTAL)*100) + "%";
  tAtual.textContent = mmss(t);
  var i = indicePara(t);
  pintaSlide(i);
  aplicar(i, t - inicios[i]);
}

function loop(ts){
  if(!rodando) return;
  if(!ultimo) ultimo = ts;
  t += (ts - ultimo)/1000; ultimo = ts;
  if(t >= TOTAL){ t = TOTAL; pinta(); return terminar(); }
  pinta();
  [25,50,75].forEach(function(p){
    if(!marcos[p] && (t/TOTAL)*100 >= p){ marcos[p]=1; ev("vsl_progresso",{percentual:p}); }
  });
  requestAnimationFrame(loop);
}

function tocar(){
  if(rodando) return;
  if(t >= TOTAL){ t = 0; marcos = {}; }
  fim.classList.remove("on");
  rodando = true; ultimo = 0;
  player.classList.remove("pausado");
  icone.innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
  requestAnimationFrame(loop);
}
function pausar(){
  if(!rodando) return;
  rodando = false;
  player.classList.add("pausado");
  icone.innerHTML = '<path d="M8 5v14l11-7z"/>';
}
function terminar(){
  rodando = false;
  player.classList.add("pausado");
  icone.innerHTML = '<path d="M8 5v14l11-7z"/>';
  fim.classList.add("on");
  if(!marcos[100]){ marcos[100]=1; ev("vsl_progresso",{percentual:100}); ev("vsl_fim"); }
}

document.getElementById("play").addEventListener("click", function(e){
  e.stopPropagation(); capa.classList.add("off"); ev("vsl_play"); tocar();
});
document.getElementById("toggle").addEventListener("click", function(e){
  e.stopPropagation(); rodando ? pausar() : tocar();
});
player.addEventListener("click", function(e){
  if(!capa.classList.contains("off")) return;
  if(e.target.closest(".chrome") || e.target.closest(".fim")) return;
  rodando ? pausar() : tocar();
});
trilho.addEventListener("click", function(e){
  e.stopPropagation();
  var r = trilho.getBoundingClientRect();
  t = Math.max(0, Math.min(TOTAL, ((e.clientX - r.left)/r.width) * TOTAL));
  if(t < TOTAL) fim.classList.remove("on");
  pinta();
  if(!rodando && t < TOTAL) tocar(); else ultimo = 0;
});
document.getElementById("rever").addEventListener("click", function(e){
  e.stopPropagation(); t = 0; marcos = {}; fim.classList.remove("on"); pinta(); tocar(); ev("vsl_rever");
});
document.getElementById("cta").addEventListener("click", function(){
  ev("clique_cta",{origem:"vsl", segundo:Math.round(t)});
});
document.getElementById("tela").addEventListener("click", function(e){
  e.stopPropagation();
  if(document.fullscreenElement) document.exitFullscreen();
  else if(player.requestFullscreen) player.requestFullscreen();
});
document.addEventListener("fullscreenchange", function(){
  player.classList.toggle("cheio", !!document.fullscreenElement);
});
document.addEventListener("keydown", function(e){
  if(e.key === " " || e.key === "k"){ e.preventDefault(); rodando ? pausar() : tocar(); }
  if(e.key === "ArrowRight"){ e.preventDefault(); t = inicios[Math.min(SLIDES.length-1, indicePara(t)+1)]; pinta(); ultimo = 0; }
  if(e.key === "ArrowLeft"){ e.preventDefault(); t = inicios[Math.max(0, indicePara(t)-1)]; pinta(); ultimo = 0; }
  if(e.key === "f"){ document.getElementById("tela").click(); }
});
if("IntersectionObserver" in window){
  new IntersectionObserver(function(es){
    es.forEach(function(x){ if(!x.isIntersecting && rodando) pausar(); });
  },{threshold:.35}).observe(player);
}

pinta();

if(new URLSearchParams(location.search).get("autoplay") === "1"){
  capa.classList.add("off"); ev("vsl_play",{auto:1}); tocar();
}
})();
</script>
</body>
</html>
